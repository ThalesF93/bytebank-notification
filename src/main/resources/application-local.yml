spring:
  application:
    name: bytebank-notification
  cloud:
    discovery:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: bytebank
    password: bytebank123


eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
      register-with-eureka: true
      fetch-registry: true
  instance:
    prefer-ip-address: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8084

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans